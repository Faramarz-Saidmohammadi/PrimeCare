name: Refresh Patched Dependencies

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/professional-repository-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched framework lockfile
        run: npm install next@^16.2.11 eslint-config-next@^16.2.11 --package-lock-only

      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency update when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: upgrade vulnerable dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
